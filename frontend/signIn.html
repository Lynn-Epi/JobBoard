<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JobBoard | Sign In</title>

    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/sign.css" />
    <script src="js/sign.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header>
      <h1 class="site-name">JobBoard</h1>

      <nav>
        <ul class="main-header">
          <li><a class="header-options" href="index.html">Home</a></li>
          <li><a class="header-options" href="index.html#jobs">Jobs</a></li>
          <li><a class="header-options" href="signIn.html">Sign In</a></li>
          <li><a class="header-options" href="account.html">My Account</a></li>
        </ul>
      </nav>
    </header>

    <main class="auth-main">
      <section class="auth-card">
        <h2>Welcome Back</h2>
        <p>Sign in to your JobBoard account.</p>

        <form id="login-form">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          />

          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />

          <p id="form-message" class="form-message" role="status"></p>

          <button type="submit" class="auth-button">Sign In</button>
        </form>

        <p class="auth-switch">
          Don't have an account?
          <a href="signUp.html">Create one</a>
        </p>
      </section>
    </main>

    <footer>
      <h4>Contact Us</h4>
      <p>Email: contact@jobboard.example</p>
    </footer>
  </body>
</html>
