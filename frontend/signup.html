<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JobBoard | Create Account</title>

    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/sign.css" />
    <script src="js/sign.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header>
      <h1 class="site-name">JobBoard</h1>

      <nav>
        <ul class="main-header">
          <li><a class="header-options" href="index.html">Home</a></li>
          <li><a class="header-options" href="index.html#jobs">Jobs</a></li>
          <li><a class="header-options" href="signIn.html">Sign In</a></li>
        </ul>
      </nav>
    </header>

    <main class="auth-main">
      <section class="auth-card">
        <h2>Create Account</h2>
        <p>Join JobBoard and find your next opportunity.</p>

        <form id="register-form">
          <label for="first_name">First Name</label>
          <input
            type="text"
            id="first_name"
            name="first_name"
            placeholder="Enter your first name"
            autocomplete="given-name"
            required
          />

          <label for="last_name">Last Name</label>
          <input
            type="text"
            id="last_name"
            name="last_name"
            placeholder="Enter your last name"
            autocomplete="family-name"
            required
          />

          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          />

          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a password"
            autocomplete="new-password"
            minlength="8"
            required
          />

          <label for="confirm_password">Confirm Password</label>
          <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            placeholder="Confirm your password"
            autocomplete="new-password"
            minlength="8"
            required
          />

          <p id="form-message" class="form-message" role="status"></p>

          <button type="submit" class="auth-button">Create Account</button>
        </form>

        <p class="auth-switch">
          Already have an account?
          <a href="signIn.html">Sign In</a>
        </p>
      </section>
    </main>

    <footer>
      <h4>Contact Us</h4>
      <p>Email: contact@jobboard.example</p>
    </footer>
  </body>
</html>
